<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A2B42"/>
      <stop offset="100%" stop-color="#0E1726"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="30" y1="20" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DFCA95"/>
      <stop offset="50%" stop-color="#C8A96B"/>
      <stop offset="100%" stop-color="#9C7E42"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8FAECE"/>
      <stop offset="100%" stop-color="#4E7097"/>
    </linearGradient>
  </defs>

  <!-- Outer Shield Crest -->
  <path d="M60 10L102 28V64C102 88.5 83.5 106.5 60 112C36.5 106.5 18 88.5 18 64V28L60 10Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Inner Shield Contrast Shadow (Left Facet) -->
  <path d="M60 16L24 32V63C24 84.5 40 100 60 106V16Z" fill="#111E30" opacity="0.4"/>
  
  <!-- Inner Shield Contrast Light (Right Facet) -->
  <path d="M60 16L96 32V63C96 84.5 80 100 60 106V16Z" fill="#1E314B" opacity="0.4"/>

  <!-- Steel Chevron Guides -->
  <path d="M34 68L44 68L60 84L54 88Z" fill="url(#steelGrad)" opacity="0.8"/>
  <path d="M86 68L76 68L60 84L66 88Z" fill="url(#steelGrad)" opacity="0.8"/>

  <!-- Main Ascending Arrow (Progress & Drive) -->
  <path d="M60 30L80 54H68V82H52V54H40L60 30Z" fill="url(#goldGrad)"/>

  <!-- Guiding Compass Star (Direction & Purpose) -->
  <path d="M60 18L63 26L71 29L63 32L60 40L57 32L49 29L57 26L60 18Z" fill="#F4F3EF"/>
  
  <!-- Arrow Center Spine -->
  <path d="M60 30L68 54H60V82H52V54H60V30Z" fill="#B39352" opacity="0.5"/>
</svg>
